name: Run salt tests
on:
  pull_request:

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: plus3it/actions-workflows/.github/workflows/test-salt-linux.yml@ddd67e99878a285f728de398c1116151c2d7791a
    strategy:
      matrix:
        os_version:
          - 8
          - 9
        salt_state:
          - nessus-agent
        salt_pillar_root:
          - ./tests/pillar/test-nessus-agent
    with:
      salt-os-version: ${{ matrix.os_version }}
      salt-state: ${{ matrix.salt_state }}
      salt-pillar-root: ${{ matrix.salt_pillar_root }}

  windows:
    uses: plus3it/actions-workflows/.github/workflows/test-salt-windows.yml@0a03f75193a010b3532cc90e8ad0b15a09ed33c1
    strategy:
      matrix:
        os_version:
          - windows-2019
          - windows-2022
        salt_state:
          - nessus-agent
        salt_pillar_root:
          - ./tests/pillar/test-nessus-agent
    with:
      salt-os-version: ${{ matrix.os_version }}
      salt-state: ${{ matrix.salt_state }}
      salt-pillar-root: ${{ matrix.salt_pillar_root }}
